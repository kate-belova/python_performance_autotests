[project]
name = "performance-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "faker>=40.28.1",
    "gevent>=26.7.0",
    "grpcio>=1.82.1",
    "grpcio-tools>=1.82.1",
    "httpx>=0.28.1",
    "locust>=2.46.2",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[tool.black]
line-length = 88
